<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接未来 | 个人隐私反代中心</title>
    <style>
        :root {
            --primary-green: #2d6a4f;
            --light-green: #d8f3dc;
            --accent-color: #52b788;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-green);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--primary-green);
        }

        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        .icon-box {
            font-size: 50px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        /* 模拟牵手/连接的动画 */
        .hand {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: var(--accent-color);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">
        <span class="hand">🤝</span>
        <span>🌿</span>
    </div>
    <h1>安全连接 · 绿色网络</h1>
    <p>这是您的私有反代网关。<br>数据正如自然界的循环，<br>每一次连接都应获得呼吸般的自由与安全。</p>
    
    <!-- 这里可以改成你实际要跳转的内部服务地址 -->
    <a href="/admin" class="btn">进入管理后台</a>

    <div class="footer">
        © 2024 私人反代节点 · 守护数据纯净
    </div>
</div>

</body>
</html>
