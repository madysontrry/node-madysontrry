<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守护可爱生灵 - 动物保护行动</title>
    <meta name="description" content="加入我们，一起保护地球上可爱的动物朋友们。">
    
    <style>
        /* --- 基础设置 & 暗黑模式支持 --- */
        :root {
            --bg-color: #f0f4f8;
            --text-color: #2d3748;
            --card-bg: #ffffff;
            --primary-color: #38a169; /* 自然绿 */
            --secondary-color: #c6f6d5;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a202c;
                --text-color: #e2e8f0;
                --card-bg: #2d3748;
                --primary-color: #48bb78;
                --secondary-color: #2f855a;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            }
        }

        body {
            /* 使用系统字体，环保且加载快 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- 顶部 Hero Header --- */
        .hero-header {
            position: relative;
            /* 首图：一只可爱的小熊猫。
               使用了 Unsplash 的动态 API 进行优化：
               w=1600 (限制最大宽度)
               q=75 (稍微降低质量以减小体积)
               fm=webp (强制使用 WebP 高效格式)
            */
            background-image: url('https://images.unsplash.com/photo-1544552866-d3ed42536cfd?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=75&fm=webp');
            background-size: cover;
            background-position: center center;
            height: 50vh; /* 占据屏幕高度的 50% */
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        /* 黑色遮罩，让文字更清晰 */
        .hero-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            padding: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero-content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* --- 主体内容容器 --- */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section h2 {
            text-align: center;
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 30px;
        }
        
        .intro-text {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px auto;
            font-size: 1.1rem;
        }

        /* --- 动物卡片网格布局 --- */
        .animal-grid {
            display: grid;
            /* 响应式网格：在小屏幕上单列，大屏幕上三列 */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .animal-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden; /* 确保图片圆角 */
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .animal-card:hover {
            transform: translateY(-5px); /* 鼠标悬停轻微上浮效果 */
        }

        /* 卡片图片样式 */
        .animal-card img {
            width: 100%;
            height: 220px;
            object-fit: cover; /* 保证图片填充且不变形 */
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card-content h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        /* --- 底部 --- */
        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            background-color: var(--secondary-color);
            color: var(--primary-color);
        }
        
        .eco-badge {
             display: inline-block;
             margin-top: 10px;
             font-size: 0.85em;
             opacity: 0.8;
        }

    </style>
</head>

    <header class="hero-header">
        <div class="hero-content">
            <h1>守护它们的微笑</h1>
            <p>因为可爱，所以珍惜；因为脆弱，所以保护。</p>
        </div>
    </header>

    <main class="container">
        <section>
            <p class="intro-text">
                地球不仅属于人类，也属于这些神奇可爱的生灵。它们的存在让世界变得丰富多彩。
                <br>
                然而，由于栖息地丧失和气候变化，许多小可爱正面临威胁。让我们行动起来，为它们保留一片生存空间。
            </p>
        </section>
